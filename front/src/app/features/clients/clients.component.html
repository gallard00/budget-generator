<div class="card p-4 shadow-sm">

  <h4>Clients</h4>

  <!-- FORMULARIO DE CREACIÓN -->
  <form class="row g-2 mb-3" (ngSubmit)="createClient()">
    <div class="col-md-4">
      <input [(ngModel)]="newClient.name" name="name" class="form-control" placeholder="Name" />
    </div>
    <div class="col-md-4">
      <input [(ngModel)]="newClient.phone" name="phone" class="form-control" placeholder="Phone" />
    </div>
    <div class="col-md-4">
      <input [(ngModel)]="newClient.address" name="address" class="form-control" placeholder="Address" />
    </div>
    <div class="col-12 mt-2">
      <button class="btn btn-primary w-100">Add Client</button>
    </div>
  </form>

  <!-- TABLA -->
  <table class="table table-striped mt-3">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Address</th>
        <th *ngIf="auth.isAdmin()">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of clients">
        <td>{{ c.id }}</td>
        <td>{{ c.name }}</td>
        <td>{{ c.phone }}</td>
        <td>{{ c.address }}</td>
        <td *ngIf="auth.isAdmin()">
          <button class="btn btn-sm btn-warning me-1" (click)="openEditModal(c)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteClient(c.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- ========= MODAL EDICIÓN CLIENT ========= -->
<div class="modal-backdrop" *ngIf="showEditModal"></div>

<div class="modal d-block" *ngIf="showEditModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Edit Client</h5>
        <button class="btn-close" (click)="closeEditModal()"></button>
      </div>

      <div class="modal-body">
        <input class="form-control mb-2" [(ngModel)]="editModel.name" placeholder="Name">
        <input class="form-control mb-2" [(ngModel)]="editModel.phone" placeholder="Phone">
        <input class="form-control mb-2" [(ngModel)]="editModel.address" placeholder="Address">
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeEditModal()">Cancel</button>
        <button class="btn btn-success" (click)="saveFromModal()">Save</button>
      </div>

    </div>
  </div>
</div>
