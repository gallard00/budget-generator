<div class="card p-4 shadow-sm calculator-container">

  <h4>Material Calculator</h4>

  <div class="row mt-3">
    <div class="col-md-4">
      <label>Width (m)</label>
      <input type="number" [(ngModel)]="width" class="form-control" />
    </div>

    <div class="col-md-4">
      <label>Height (m)</label>
      <input type="number" [(ngModel)]="height" class="form-control" />
    </div>

    <div class="col-md-4">
      <label>Price per m²</label>
      <input type="number" [(ngModel)]="pricePerM2" class="form-control" />
    </div>
  </div>

  <button class="btn btn-primary mt-3 w-100" (click)="calculate()">Calculate</button>

  <div *ngIf="area > 0" class="mt-3 alert alert-secondary">
    <strong>Area:</strong> {{ area }} m² <br />
    <strong>Total cost:</strong> {{ total | currency:'ARS' }}
  </div>

  <div class="d-flex gap-2 mt-3">
    <button (click)="sendToBudget()" class="btn btn-success w-50">
      ➕ Add to Budget
    </button>

    <button (click)="reset()" class="btn btn-outline-danger w-50">
      Reset
    </button>
  </div>

</div>
