<div class="card p-4 shadow-sm">
  <h4>Budgets</h4>

  <!-- FORM NUEVO -->
  <div class="row mb-3">
    <div class="col-md-4">
      <select [(ngModel)]="newBudget.clientId" class="form-select">
        <option [ngValue]="0">Select Client</option>
        <option *ngFor="let c of clients" [ngValue]="c.id">{{ c.name }}</option>
      </select>
    </div>
    <div class="col-md-4">
      <input [(ngModel)]="newBudget.date" type="date" class="form-control" />
    </div>
  </div>

  <h5>Add Items</h5>
  <div class="row g-2">
    <div class="col-md-5">
      <input [(ngModel)]="newItem.description" class="form-control" />
    </div>
    <div class="col-md-2">
      <input [(ngModel)]="newItem.quantity" type="number" class="form-control" />
    </div>
    <div class="col-md-3">
      <input [(ngModel)]="newItem.unitPrice" type="number" class="form-control" />
    </div>
    <div class="col-md-2">
      <button class="btn btn-outline-success w-100" (click)="addItem()">Add</button>
    </div>
  </div>

  <ul class="list-group mt-3">
    <li *ngFor="let i of newBudget.items; let idx = index" class="list-group-item d-flex justify-content-between">
      <span>{{ i.description }} — {{ i.quantity }} x {{ i.unitPrice | currency:'ARS' }}</span>
      <button class="btn btn-sm btn-danger" (click)="removeItem(idx)">✖</button>
    </li>
  </ul>

  <button class="btn btn-primary mt-3 w-100" (click)="createBudget()">Save Budget</button>

  <hr />

  <!-- LISTADO -->
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>ID</th>
        <th>Date</th>
        <th>Total</th>
        <th>Client</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let b of budgets">
        <td>{{ b.id }}</td>
        <td>{{ b.date }}</td>
        <td>{{ b.total | currency:'ARS' }}</td>
        <td>{{ b.client }}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-1" (click)="openPdfModal(b.id!)">PDF</button>

          <button *ngIf="auth.isAdmin()" class="btn btn-sm btn-info me-1" (click)="viewHistory(b.id!)">
            History
          </button>

          <button *ngIf="auth.isAdmin()" class="btn btn-sm btn-warning me-1" (click)="openEditModal(b)">
            Edit
          </button>

          <button *ngIf="auth.isAdmin()" class="btn btn-sm btn-danger" (click)="deleteBudget(b.id!)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- ========= MODAL EDICIÓN BUDGET ========= -->
<div class="modal-backdrop" *ngIf="showEditModal"></div>

<div class="modal d-block" *ngIf="showEditModal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Edit Budget</h5>
        <button class="btn-close" (click)="closeEditModal()"></button>
      </div>

      <div class="modal-body">
        <select class="form-select mb-2" [(ngModel)]="editBudget.clientId">
          <option *ngFor="let c of clients" [value]="c.id">{{ c.name }}</option>
        </select>

        <input type="date" class="form-control mb-3" [(ngModel)]="editBudget.date">

        <h6>Items</h6>

        <div *ngFor="let item of editBudget.items; let i = index" class="row mb-2">
          <div class="col">
            <input class="form-control" [(ngModel)]="item.description">
          </div>
          <div class="col-2">
            <input type="number" class="form-control" [(ngModel)]="item.quantity">
          </div>
          <div class="col-2">
            <input type="number" class="form-control" [(ngModel)]="item.unitPrice">
          </div>
          <div class="col-1">
            <button class="btn btn-danger btn-sm" (click)="removeItemFromEdit(i)">✖</button>
          </div>
        </div>

        <button class="btn btn-outline-primary mt-2" (click)="addItemToEdit()">
          Add Item
        </button>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeEditModal()">Cancel</button>
        <button class="btn btn-success" (click)="saveBudgetFromModal()">Save</button>
      </div>

    </div>
  </div>
</div>
